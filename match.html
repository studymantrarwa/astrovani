<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrovani Kundli Matching</title><link rel="stylesheet" href="/style.css"></head><body><nav class="nav"><a class="brand" href="/">✦ Astrovani</a><div class="navlinks"><a href="/kundli.html">Kundli</a><a href="/panchang.html">Panchang</a></div></nav><main class="wrap"><div class="card"><h2>💞 Kundli Matching — Ashtakoota</h2><p class="muted">Enter Moon Rashi and Nakshatra numbers from each person's Kundli. The server calculates the eight traditional kootas.</p><div class="row"><label>Person A — Rashi<select id="as"></select></label><label>Person A — Nakshatra<select id="an"></select></label></div><div class="row"><label>Person B — Rashi<select id="bs"></select></label><label>Person B — Nakshatra<select id="bn"></select></label></div><button class="btn primary" id="go">Calculate 36 Gun</button></div><div id="out" style="margin-top:14px"></div></main><script src="/app.js"></script><script>const signs=['मेष','वृषभ','मिथुन','कर्क','सिंह','कन्या','तुला','वृश्चिक','धनु','मकर','कुंभ','मीन'];const nak=['Ashwini','Bharani','Krittika','Rohini','Mrigashira','Ardra','Punarvasu','Pushya','Ashlesha','Magha','Purva Phalguni','Uttara Phalguni','Hasta','Chitra','Swati','Vishakha','Anuradha','Jyeshtha','Mula','Purva Ashadha','Uttara Ashadha','Shravana','Dhanishtha','Shatabhisha','Purva Bhadrapada','Uttara Bhadrapada','Revati'];for(const id of ['as','bs'])document.querySelector('#'+id).innerHTML=signs.map((x,i)=>`<option value="${i+1}">${i+1} — ${x}</option>`).join('');for(const id of ['an','bn'])document.querySelector('#'+id).innerHTML=nak.map((x,i)=>`<option value="${i+1}">${i+1} — ${x}</option>`).join('');document.querySelector('#go').onclick=async()=>{const b=document.querySelector('#go');Astrovani.setLoading(b,true);try{const d=await Astrovani.api('/api/match',{method:'POST',body:JSON.stringify({a_sign:+as.value,a_nakshatra:+an.value,b_sign:+bs.value,b_nakshatra:+bn.value})});document.querySelector('#out').innerHTML=`<div class="card"><div class="stat">${d.total} / ${d.out_of}</div><p class="muted">Component-wise Ashtakoota result</p><table class="table"><thead><tr><th>Koota</th><th>Score</th><th>Max</th></tr></thead><tbody>${d.components.map(c=>`<tr><td>${c.name}</td><td>${c.score}</td><td>${c.max}</td></tr>`).join('')}</tbody></table><div class="notice" style="margin-top:12px">${d.note}</div></div>`}catch(e){Astrovani.toast(e.message,'error')}finally{Astrovani.setLoading(b,false)}};</script></body></html>
