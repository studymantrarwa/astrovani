<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrovani Kundli Chart</title><link rel="stylesheet" href="/style.css"></head><body><nav class="nav"><a class="brand" href="/">✦ Astrovani</a><div class="navlinks"><a href="/kundli.html">← New Kundli</a></div></nav><main class="wrap" id="root"></main><script src="/app.js"></script><script>
const d=Astrovani.loadKundli();if(!d){location.href='/kundli.html'}else{const p=d.person;const planets=d.planets;const houses=d.d1;function chart(){let names=Object.keys(houses);let pos=[[50,8],[25,22],[8,50],[25,78],[50,92],[75,78],[92,50],[75,22],[64,35],[36,35],[36,65],[64,65]];let svg='<svg viewBox="0 0 100 100" aria-label="North Indian chart"><polygon points="50,2 98,50 50,98 2,50" fill="none" stroke="#536a82"/><line x1="2" y1="50" x2="50" y2="98" stroke="#536a82"/><line x1="50" y1="98" x2="98" y2="50" stroke="#536a82"/><line x1="98" y1="50" x2="50" y2="2" stroke="#536a82"/><line x1="50" y1="2" x2="2" y2="50" stroke="#536a82"/><line x1="2" y1="50" x2="50" y2="2" stroke="#536a82"/><line x1="50" y1="98" x2="98" y2="50" stroke="#536a82"/><line x1="50" y1="50" x2="50" y2="2" stroke="#536a82"/><line x1="50" y1="50" x2="98" y2="50" stroke="#536a82"/><line x1="50" y1="50" x2="50" y2="98" stroke="#536a82"/><line x1="50" y1="50" x2="2" y2="50" stroke="#536a82"/>';for(let i=0;i<12;i++){let x=pos[i][0],y=pos[i][1];let arr=houses[String(i+1)]||[];svg+=`<text x="${x}" y="${y-5}" text-anchor="middle" class="houseNo">${i+1}</text><text x="${x}" y="${y+1}" text-anchor="middle" class="planet">${arr.map(n=>n.slice(0,3)).join(' ')||''}</text>`}svg+='<circle cx="50" cy="50" r="13" class="center"/><text x="50" y="50" text-anchor="middle" dominant-baseline="middle" class="planet">Lagna</text></svg>';return '<div class="chartbox">'+svg+'</div>'}let rows=Object.entries(planets).map(([n,v])=>`<tr><td>${n}</td><td>${v.sign_hi} (${v.sign_no})</td><td>${v.degree.toFixed(2)}°</td><td>House ${v.house}</td><td>${v.nakshatra} / Pada ${v.pada}</td><td>${v.retrograde?'Yes':'No'}</td></tr>`).join('');let d9=Object.entries(d.d9).map(([n,v])=>`<tr><td>${n}</td><td>${v.sign_hi}</td><td>${v.sign_no}</td></tr>`).join('');let dash=d.dasha.map((x,i)=>`<details ${i===0?'open':''}><summary><b>${x.lord}</b> — ${x.start} to ${x.end}</summary><div class="list">${x.antardasha.map(a=>`<div class="item"><span class="pill">Antardasha</span> ${a.lord} • ${a.start} → ${a.end}<div class="small muted">Pratyantardasha: ${a.pratyantardasha.map(q=>q.lord).join(' • ')}</div></div>`).join('')}</div></details>`).join('');document.querySelector('#root').innerHTML=`<div class="grid2"><div class="card"><h2>${Astrovani.esc(p.name)}</h2><p class="muted">${Astrovani.esc(p.date)} • ${Astrovani.esc(p.time)} • ${Astrovani.esc(p.place)}</p><p>Lagna: <b>${d.lagna.sign_hi} ${d.lagna.sign}</b> • ${d.lagna.degree.toFixed(2)}° • ${d.lagna.nakshatra}, Pada ${d.lagna.pada}</p><p class="small muted">Swiss Ephemeris • Sidereal • Lahiri • ${Astrovani.esc(p.timezone)}</p></div><div class="card"><h3>Yogas</h3>${d.yogas.length?d.yogas.map(y=>`<div class="item"><b>${y.name}</b><div class="small muted">${y.description}</div></div>`).join(''):'<p class="muted">No basic yoga detected by the included rules.</p>'}</div></div><div class="card" style="margin-top:14px"><h2>D1 / Rashi Chart</h2>${chart()}</div><div class="card" style="margin-top:14px"><h2>Planetary Positions</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Planet</th><th>Rashi</th><th>Degree</th><th>House</th><th>Nakshatra</th><th>Retro</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="card" style="margin-top:14px"><h2>D9 / Navamsa</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Planet</th><th>Navamsa</th><th>Sign No.</th></tr></thead><tbody>${d9}</tbody></table></div></div><div class="card" style="margin-top:14px"><h2>Vimshottari Dasha</h2>${dash}</div>`}
</script></body></html>
