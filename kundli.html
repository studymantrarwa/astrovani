<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrovani Kundli</title><link rel="stylesheet" href="/style.css"></head><body><nav class="nav"><a class="brand" href="/">✦ Astrovani</a><div class="navlinks"><a href="/">Home</a><a href="/match.html">Matching</a></div></nav><main class="wrap"><div class="card"><h2>🪐 Kundli Maker</h2><p class="muted">Birth place search uses Open-Meteo geocoding. Latitude, longitude and timezone are filled automatically.</p><form id="form" class="form"><label>Name<input id="name" required placeholder="Your name"></label><div class="row"><label>Gender<select id="gender"><option>Male</option><option>Female</option><option>Other</option></select></label><label>Date of birth<input id="date" type="date" required></label></div><label>Time of birth<input id="time" type="time" required></label><label>Birth place<input id="place" autocomplete="off" placeholder="Type city / town" required></label><div id="places" class="list"></div><div class="row"><label>Latitude<input id="lat" readonly required></label><label>Longitude<input id="lon" readonly required></label></div><label>Timezone<input id="tz" value="Asia/Kolkata" readonly></label><div class="actions"><button class="btn primary" id="go">Generate Kundli</button><a class="btn" href="/">Cancel</a></div></form></div></main><script src="/app.js"></script><script>
const p=document.querySelector('#place'),box=document.querySelector('#places');let timer; p.addEventListener('input',()=>{clearTimeout(timer);const q=p.value.trim();if(q.length<2){box.innerHTML='';return}timer=setTimeout(async()=>{try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=6&language=en&format=json');const d=await r.json();box.innerHTML=(d.results||[]).map(x=>`<button type="button" class="btn" style="text-align:left" data-lat="${x.latitude}" data-lon="${x.longitude}" data-tz="${x.timezone||'Asia/Kolkata'}" data-name="${Astrovani.esc(x.name+(x.admin1?', '+x.admin1:''))}">${Astrovani.esc(x.name)} <span class="muted">${Astrovani.esc(x.country||'')}</span></button>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{p.value=b.dataset.name;document.querySelector('#lat').value=b.dataset.lat;document.querySelector('#lon').value=b.dataset.lon;document.querySelector('#tz').value=b.dataset.tz;box.innerHTML=''})}catch(e){Astrovani.toast('Place search failed','error')}},350)});document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#go');Astrovani.setLoading(btn,true);try{if(!document.querySelector('#lat').value)throw Error('Please select a birth place from the suggestions');const d=await Astrovani.api('/api/calculate',{method:'POST',body:JSON.stringify({name:document.querySelector('#name').value,date:document.querySelector('#date').value,time:document.querySelector('#time').value,place:p.value,lat:+document.querySelector('#lat').value,lon:+document.querySelector('#lon').value,timezone:document.querySelector('#tz').value})});Astrovani.saveKundli(d);location.href='/chart.html'}catch(err){Astrovani.toast(err.message,'error')}finally{Astrovani.setLoading(btn,false)}};
</script></body></html>
