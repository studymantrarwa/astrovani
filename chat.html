<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrovani Live Chat</title><link rel="stylesheet" href="/style.css"></head><body><nav class="nav"><a class="brand" href="/">✦ Astrovani</a><div class="navlinks"><a href="/astrologers.html">Astrologers</a></div></nav><main class="wrap"><div class="card chat"><h2>💬 Live Consultation Chat</h2><div class="notice small">This UI is ready for Supabase Realtime connection. In this ZIP, messages are local-demo until you add Supabase URL/anon key.</div><div class="messages" id="messages"></div><div class="composer"><input id="text" placeholder="Type your message…"><button class="btn primary" id="send">Send</button></div></div></main><script src="/app.js"></script><script>const key='astrovaniDemoChat';let msgs=JSON.parse(localStorage.getItem(key)||'[]');function render(){messages.innerHTML=msgs.map(m=>`<div class="msg ${m.me?'me':''}">${Astrovani.esc(m.text)}</div>`).join('');messages.scrollTop=messages.scrollHeight}send.onclick=()=>{if(!text.value.trim())return;msgs.push({text:text.value.trim(),me:true});text.value='';localStorage.setItem(key,JSON.stringify(msgs));render()};text.onkeydown=e=>{if(e.key==='Enter')send.click()};render();</script></body></html>
