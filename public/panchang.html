<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrovani Panchang</title><link rel="stylesheet" href="/style.css"></head><body><nav class="nav"><a class="brand" href="/">✦ Astrovani</a><div class="navlinks"><a href="/kundli.html">Kundli</a></div></nav><main class="wrap"><div class="card"><h2>🌙 Panchang</h2><p class="muted">Astronomical core calculated with the same Swiss Ephemeris/Lahiri engine.</p><div class="row"><label>Date<input id="date" type="date"></label><label>Time<input id="time" type="time" value="12:00"></label></div><label>Place<input id="place" value="India"></label><div class="row"><label>Latitude<input id="lat" type="number" value="26.85" step="0.0001"></label><label>Longitude<input id="lon" type="number" value="80.95" step="0.0001"></label></div><button class="btn primary" id="go">Calculate</button></div><div id="out" style="margin-top:14px"></div></main><script src="/app.js"></script><script>date.value=new Date().toISOString().slice(0,10);go.onclick=async()=>{try{const d=await Astrovani.api('/api/panchang',{method:'POST',body:JSON.stringify({name:'Panchang',date:date.value,time:time.value,place:place.value,lat:+lat.value,lon:+lon.value,timezone:'Asia/Kolkata'})});out.innerHTML=`<div class="grid"><div class="card"><h3>Tithi</h3><div class="stat">${d.tithi.paksha}</div><p class="muted">Tithi ${d.tithi.name_no}</p></div><div class="card"><h3>Nakshatra</h3><div class="stat">${d.nakshatra.nakshatra}</div><p class="muted">Pada ${d.nakshatra.pada} • Lord ${d.nakshatra.lord}</p></div><div class="card"><h3>Yoga</h3><div class="stat">#${d.yoga_number}</div><p class="muted">Astronomical yoga index</p></div></div><div class="notice" style="margin-top:14px">${d.note}</div>`}catch(e){Astrovani.toast(e.message,'error')}};</script></body></html>
